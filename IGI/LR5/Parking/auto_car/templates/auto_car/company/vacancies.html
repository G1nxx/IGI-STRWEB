{% extends "auto_car/base.html" %}

{% block content %}
<main class="container">
    <header>
        <h1>Вакансии</h1>
    </header>
    <section class="vacancies">
        {% for vacancy in vacancies %}
        <article class="vacancy-card" style="padding-left: 6px; padding-right: 6px; margin: 4px; background-color: bisque; border-radius: 5px;">
            <h3 class="vacancy-name">Вакансия: {{ vacancy.name }}</h3>
            <p class="vacancy-salary">Зарплата: {{ vacancy.salary }} $</p>
            <p class="vacancy-info">Иформация: {{ vacancy.info }}</p>
        </article>
        {% endfor %}
    </section>
</main>
{% endblock %}

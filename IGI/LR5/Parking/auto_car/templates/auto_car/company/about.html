{% extends "auto_car/base.html" %}

{% block content %}
<main class="container">
    {% if about %}
        <section aria-labelledby="about-heading">
            <h2 id="about-heading">О нас</h2>
            <div class="info">
                <p>{{ about.info }}</p>
            </div>
        </section>
    {% endif %}
    {% if last %}
        <article aria-labelledby="news-heading" style="padding: 6px; margin: 4px; background-color: bisque; border-radius: 5px;">
            <header>
                <h3 id="news-heading">{{ last.title }}</h3>
            </header>
            <p>{{ last.text }}</p>
            <footer>
                <time datetime="{{ last.date|date:'Y-m-d' }}">{{ last.date }}</time>
            </footer>
        </article>
    {% endif %}
</main>
{% endblock %}

{% extends "auto_car/base.html" %}

{% load static %}
{% block content %}
<main class="container">
    <section aria-labelledby="news-heading">
        <h2 id="news-heading">Новости</h2>
        <div class="news-list">
            {% for n in news %}
            <article class="news-item" style="padding: 6px; margin: 4px; background-color: bisque; border-radius: 5px;">
                <header>
                    <h3>{{ n.title }}</h3>
                </header>
                <div class="news-content" style="display: flex; align-items: flex-start; gap: 20px;">
                    <div class="news-text" style="flex: 1;">
                        <p>{{ n.text }}</p>
                    </div>
                    <div class="news-image">
                        <img src="{% static n.pic.url %}" alt="Иллюстрация к новости: {{ n.title }}" width="250" height="250" style="object-fit: cover;">
                    </div>
                </div>
                <footer>
                    <time datetime="{{ n.date|date:'Y-m-d' }}">{{ n.date }}</time>
                </footer>
            </article>
            {% endfor %}
        </div>
    </section>
</main>
{% endblock %}

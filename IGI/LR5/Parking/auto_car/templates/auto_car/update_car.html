{% extends "auto_car/base.html" %}

{% block content %}
<main class="container">
    <h1>Обновление информации об автомобиле</h1>
    <form method="post" action="{% url 'auto_car:client_dashboard/update_car/update' car_id %}">
        {% csrf_token %}
        {% if error %}
            <div role="alert" aria-live="polite">
                <p>{{ error }}</p>
            </div>
        {% endif %}
        <fieldset>
            <legend>Информация об автомобиле</legend>
            <div>
                <label for="brand">Марка:</label>
                <input id="brand" name="brand" type="text" placeholder="{{ data.brand }}" required aria-required="true">
            </div>
            <div>
                <label for="model">Модель:</label>
                <input id="model" name="model" type="text" placeholder="{{ data.model }}" required aria-required="true">
            </div>
            <div>
                <label for="number">Номер:</label>
                <input id="number" name="number" type="text" placeholder="{{ data.number }}" required aria-required="true">
            </div>
            <div>
                <label for="type">Тип:</label>
                <input id="type" name="type" type="text" placeholder="{{ data.type }}" required aria-required="true">
            </div>
        </fieldset>
        <button type="submit">Обновить</button>
    </form>
</main>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <a href="{% url 'auto_car:index' %}">
        {% block title %}Парковочный сервис{% endblock %}
    </a>
    <style>
        .auth-links { float: right; }
        .user-info { background: #eee; padding: 10px; }
    </style>
</head>
<body>
    <div class="auth-links">
        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}!</span>
            <a href="{% url 'auto_car:logout' %}">Выйти</a>
            <a href="{% url 'auto_car:client_dashboard' %}">Личный кабинет</a>
        {% else %}
            <a href="{% url 'auto_car:login' %}">Войти</a> | 
            <a href="{% url 'auto_car:signup' %}">Регистрация</a>
        {% endif %}
    </div>
    {% block content %}{% endblock %}
</body>
</html>

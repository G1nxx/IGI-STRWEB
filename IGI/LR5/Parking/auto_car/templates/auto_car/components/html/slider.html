{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{% static 'css/slider.css' %}">
</head>
<body>
    <div class="slider-container">
        <div id="mySlider" class="slider"></div>    
    </div>
    <script src="{% static 'js/slider.js' %}"></script>
</body>
</html>


{% if user.is_staff %}
<form id="adminForm" class="slider-admin-panel">

    <div class="form-group">
        <label for="delayInput">Speed (seconds):</label>
        <input type="number" id="delayInput" min="1" value="5" style="width: 60px;">
    </div>

    <div class="form-group">
        <label for="loopInput">Loop:</label>
        <input type="checkbox" id="loopInput">
    </div>

    <div class="form-group">
        <label for="navsInput">Navigation arrows:</label>
        <input type="checkbox" id="navsInput">
    </div>

    <div class="form-group">
        <label for="pagsInput">Pagination dots:</label>
        <input type="checkbox" id="pagsInput">
    </div>

    <div class="form-group">
        <label for="autoInput">Auto play:</label>
        <input type="checkbox" id="autoInput">
    </div>

    <div class="form-group">
        <label for="stopMouseHoverInput">Pause on hover:</label>
        <input type="checkbox" id="stopMouseHoverInput">
    </div>

    <button type="submit" class="slider-admin-btn">Set</button>

</form>

{% endif %}

{% extends "auto_car/base.html" %}

{% block content %}
<main class="container">
    <header>
        <h1>Регистрация</h1>
    </header>

    <section class="signup-form-section">
        <form method="post" action="{% url 'auto_car:signup' %}" class="signup-form">
            {% csrf_token %}

            {% if error %}
            <div role="alert" aria-live="polite" class="error-message">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <fieldset>
                <legend>Личная информация</legend>

                <div class="form-group">
                    <label for="username">Имя:</label>
                    <input id="username" name="username" type="text"
                           value="{{ form_data.username|default:'' }}"
                           required aria-required="true" placeholder="Введите имя">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email"
                           value="{{ form_data.email|default:'' }}"
                           required aria-required="true" placeholder="Введите email">
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input id="password" name="password" type="password"
                           required aria-required="true" placeholder="Введите пароль">
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона:</label>
                    <input id="phone" name="phone" type="tel"
                           value="{{ form_data.phone|default:'' }}"
                           required aria-required="true" placeholder="+375 (__) ___-__-__">
                </div>

                <div class="form-group">
                    <label for="birthday">Дата рождения:</label>
                    <input id="birthday" name="birthday" type="date"
                           value="{{ form_data.birthday|default:'' }}"
                           required aria-required="true">
                </div>
            </fieldset>

            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </form>
    </section>

    {% if fact %}
    <aside aria-label="Шутка дня" class="joke-card">
        <h2>Шутка дня</h2>
        <div class="joke">
            <p>{{ fact.setup }}</p>
            <p><strong>{{ fact.punchline }}</strong></p>
        </div>
    </aside>
    {% endif %}
</main>
{% endblock %}

{% extends "auto_car/base.html" %}

{% block content %}
    <main>
        <h1>Вход в систему</h1>
        {% if error %}
            <div role="alert" aria-live="polite">
                <p>{{ error }}</p>
            </div>
        {% endif %}
        <form method="post" action="{% url 'auto_car:login' %}">
            {% csrf_token %}
            <fieldset>
                <legend>Введите ваши учетные данные</legend>
                <div>
                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" required aria-required="true" />
                </div>
                <div>
                    <label for="password">Пароль:</label>
                    <input id="password" name="password" type="password" required aria-required="true" />
                </div>
            </fieldset>
            <button type="submit">Войти</button>
        </form>
        {% if fact.fact %}
            <aside aria-label="Интересный факт">
                <p>{{ fact.fact }}</p>
            </aside>
        {% endif %}
    </main>
{% endblock content %}

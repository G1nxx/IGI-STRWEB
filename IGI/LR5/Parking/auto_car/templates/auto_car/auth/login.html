{% extends "auto_car/base.html" %}

{% block content %}
<main class="form-container">
    <h1 class="page-title">Вход в систему</h1>

    {% if error %}
        <div role="alert" aria-live="polite" class="error-message">
            <p>{{ error }}</p>
        </div>
    {% endif %}

    <form method="post" action="{% url 'auto_car:login' %}" class="styled-form">
        {% csrf_token %}
        <fieldset>
            <legend>Введите ваши учетные данные</legend>

            <div class="form-group">
                <label for="email">Email:</label>
                <input id="email" name="email" type="email"
                       value="{{ form_data.email|default:'' }}"
                       required aria-required="true"
                       placeholder="Введите ваш email">
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input id="password" name="password" type="password"
                       required aria-required="true"
                       placeholder="Введите ваш пароль">
            </div>
        </fieldset>

        <button type="submit" class="btn-primary">Войти</button>
    </form>

    {% if fact.fact %}
        <aside aria-label="Интересный факт" class="fact-box">
            <div class="fact-content">
                <p>{{ fact.fact }}</p>
            </div>
        </aside>
    {% endif %}
</main>
{% endblock %}
